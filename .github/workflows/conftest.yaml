name: Validate

on:
  workflow_dispatch:
  push:
    paths:
      - '!README.md'
      - '!.github/**'
      - '.github/workflows/conftest.yaml'
  pull_request:
    paths:
      - '!README.md'
      - '!.github/**'
      - '.github/workflows/conftest.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Conftest
        uses: redhat-cop/github-actions/confbatstest@cc45c69b6655161f278271cd0c68ddcc1444a3f8 # v4.6
        with:
          tests: _test/conftest.sh
